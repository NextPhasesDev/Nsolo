rules.full=IFYA KUTAMBA NSOLO\n\nUKUTENDULA:\n- Ama row 4 x ama column 8\n- Player A (Pink): Ama row ya panshi 2\n- Player B (Blue): Ama row ya pamulu 2\n- Cila cobo catendeka na amabwe 2\n\nUMUTAMBO:\n- Kanda mu cobo ca munda yobe ukabule amabwe\n- Amabwe yalaponywa cimo cimo mu ma cobo, anti-clockwise\n- Nga ibwe lyakulekelesha lyafika mu cobo icili na amabwe, bwelelapo ubule yonse no kutwalilila\n- Uleisa pwa apo ibwe lyakulekelesha lyawila mu cobo icashale ubusa\n\nUKWIKATA:\n- Nga ibwe lyobe lyakulekelesha lyafika mu munda yobe,\n  ukekata amabwe yonse mu ma row yamu lwani mu column yamo\n- Amabwe yakwekatwa yalisankwa ku score yobe\n\nUKUPONENA:\n- Umutambo ulekonka mpaka umo apwa amabwe\n- Uyo ali na amabwe yakwekatwa ayengi ewingila