rules.full=MOMWE MUNGASEWERE NSOLO\n\nKONZEKERA:\n- Bolodi ndi 4 rows x 8 columns\n- Player A (Pink): ma row awiri a pansi\n- Player B (Blue): ma row awiri apamwamba\n- Dzenje lililonse limayamba ndi miyala 2\n\nM'MENE MASEWERA AMAYENDA:\n- Dinani dzenje m'dera lanu kuti mutenge miyala\n- Miyala imayikidwa imodzi imodzi mozungulira (anticlockwise)\n- Ngati mwala womaliza walowa m'dzenje lokhala ndi miyala, tengani zonse ndikupitiriza\n- Kuyenda kumatha pamene mwala womaliza walowa m'dzenje lopanda kanthu\n\nKUGWIRA:\n- Ngati mwala wanu womaliza wagwera m'dera lanu,\n  mumagwira miyala yonse ya mdani mu row ziwiri za column yomweyo\n- Miyala yogwidwa imawonjezedwa pa score yanu\n\nKUPAMBANA:\n- Masewera amathera pamene m'modzi alibe miyala\n- Wokhala ndi miyala yambiri yogwidwa ndiye wopambana