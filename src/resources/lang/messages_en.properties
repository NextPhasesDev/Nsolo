rules.full=HOW TO PLAY NSOLO\n\nSETUP:\n- 4 rows x 8 columns board\n- Player A (Pink): Bottom 2 rows\n- Player B (Blue): Top 2 rows\n- Each hole starts with 2 stones\n\nGAMEPLAY:\n- Click a hole in your territory to pick up stones\n- Stones are sowed anticlockwise, one per hole\n- If last stone lands in a hole with stones, pick them all up and continue\n- Movement continues until last stone lands in an empty hole\n\nCAPTURING:\n- When your last stone lands in your territory,\n  you capture ALL stones from both opponent rows in that column\n- Captured stones are added to your score\n\nWINNING:\n- Game ends when one player has no stones left\n- Player with most captured stones wins